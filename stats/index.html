<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://esm.sh; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://esm.sh; font-src 'self'; base-uri 'self'; object-src 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="dark" />
  <title>Tiny Arcade — Stats</title>
  <style>
    :root {
      --bg: #0c0d12; --bg-soft: #14161d; --line: #262a36; --text: #f2f4f9;
      --muted: #949cb0; --accent: #fb7185; color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1000px 500px at 50% -10%, #15181f, transparent 70%), var(--bg);
      color: var(--text); min-height: 100dvh; padding: 24px 16px 60px;
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; margin: 0; letter-spacing: -.02em; }
    a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
    a.back:hover { color: var(--text); }
    .btn {
      font: inherit; font-weight: 700; color: #10131c; background: var(--accent);
      border: none; border-radius: 999px; padding: 10px 20px; cursor: pointer;
    }
    .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 6px 14px; font-weight: 600; }
    .btn.ghost:hover { color: var(--text); border-color: var(--muted); }
    .hdr-actions { display: flex; align-items: center; gap: 12px; }
    .upd { color: var(--muted); font-size: .72rem; font-variant-numeric: tabular-nums; }
    .ranges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .chip { font: inherit; font-size: .8rem; font-weight: 600; color: var(--muted); background: var(--bg-soft); border: 1px solid var(--line); border-radius: 999px; padding: 6px 15px; cursor: pointer; }
    .chip:hover:not(.on) { color: var(--text); border-color: var(--muted); }
    .chip.on { color: #10131c; background: var(--accent); border-color: var(--accent); font-weight: 800; }
    .rl { color: var(--muted); font-weight: 500; font-size: .82rem; }
    .msg { color: var(--muted); background: var(--bg-soft); border: 1px solid var(--line); border-radius: 14px; padding: 24px; text-align: center; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .card { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
    .card .n { font-size: 1.9rem; font-weight: 900; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .card .l { color: var(--muted); font-size: .78rem; margin-top: 2px; }
    /* Today's counts are absolute, not part of the selected window — keep them
       out of the cards so the two kinds of number are never confused. */
    .today { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 12px 2px 0; color: var(--muted); font-size: .82rem; }
    .today b { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
    section { margin-top: 32px; }
    section h2 { font-size: 1rem; margin: 0 0 14px; }

    /* Ranked horizontal bars (plays per game). */
    .row { display: grid; grid-template-columns: minmax(0, 148px) 1fr 48px; align-items: center; gap: 12px; margin-bottom: 8px; font-size: .85rem; }
    .row .k { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .row .k b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar { background: var(--bg-soft); border-radius: 7px; height: 20px; position: relative; overflow: hidden; }
    .bar > span { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 7px; min-width: 3px; }
    .row .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }

    /* One column chart for every time series (by hour, last 30 days), so the
       bars and their labels share a single grid instead of two in lockstep. */
    .cols { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
    .col { display: grid; grid-template-rows: 120px auto; gap: 7px; min-width: 0; }
    .col-bar { position: relative; background: var(--bg-soft); border-radius: 5px; }
    .col-bar > span { position: absolute; inset: auto 0 0 0; background: var(--accent); border-radius: 5px; min-height: 3px; }
    .col-l { color: var(--muted); font-size: .62rem; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .peak { color: var(--muted); font-size: .75rem; margin: 10px 0 0; }
    .foot { color: var(--muted); font-size: .75rem; margin-top: 34px; }
    @media (max-width: 560px) {
      .cols { gap: 2px; }
      .col { grid-template-rows: 96px auto; }
      .row { grid-template-columns: minmax(0, 108px) 1fr 40px; gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="vertical-align:-4px" aria-hidden="true"><path d="M5 19V10M12 19V5M19 19v-7"/></svg> Tiny Arcade — Stats</h1>
      <div class="hdr-actions"><span id="actions"></span><a class="back" href="/index.html">← Arcade</a></div>
    </header>
    <div id="root"><div class="msg">Loading…</div></div>
    <p class="foot">Private · anonymous analytics · times in IST (Asia/Kolkata).</p>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    import { gameIcon, gameName } from '../assets/games.js?v=1';
    const SUPABASE_URL = 'https://tmngedsmgcgbkbkmsnsw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_qFZySs9l19_7bISrvmLHIw_vwt-DUdx';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    const root = document.getElementById('root');
    const actions = document.getElementById('actions');
    const esc = (s) => String(s ?? '').replace(/[&<>"'`]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' }[c]));
    const nf = new Intl.NumberFormat('en-IN');

    // slug -> [icon, display name] for friendlier "Plays per game" labels.
    // Time-range filter for the windowed figures (null = all time).
    const RANGES = [['24h', 1], ['7 days', 7], ['30 days', 30], ['All', null]];
    let currentDays = null;
    const rangeLabel = () => currentDays == null ? 'all time' : currentDays === 1 ? 'last 24h' : `last ${currentDays} days`;
    const rangesBar = () => '<div class="ranges">' + RANGES.map(([lbl, d]) =>
      `<button class="chip${d === currentDays ? ' on' : ''}" data-days="${d == null ? '' : d}">${lbl}</button>`).join('') + '</div>';

    function signInView(note) {
      actions.innerHTML = '';
      root.innerHTML = `<div class="msg">${note ? esc(note) + '<br><br>' : ''}<button class="btn" id="si">Sign in with Google</button></div>`;
      document.getElementById('si').onclick = () =>
        supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
    }

    /** Ranked horizontal bars: `items` are pre-sorted {slug, value}. */
    function bars(items, label) {
      const max = Math.max(1, ...items.map((i) => i.value));
      return items.map((i) => {
        const name = gameName(i.slug);
        return `<div class="row"><span class="k">${gameIcon(i.slug, 15)}<b>${esc(name)}</b></span>` +
          `<div class="bar" role="img" aria-label="${esc(name)}: ${i.value}"><span style="width:${(i.value / max) * 100}%"></span></div>` +
          `<span class="v">${nf.format(i.value)}</span></div>`;
      }).join('') || `<div class="msg">No ${label} yet.</div>`;
    }

    /** One column chart for every time series. `items` are {label, value, title}. */
    function columns(items, labelEvery = 1) {
      const max = Math.max(1, ...items.map((i) => i.value));
      const cols = items.map((i, idx) =>
        `<div class="col"><div class="col-bar" role="img" aria-label="${esc(i.title)}: ${i.value}" title="${esc(i.title)} · ${i.value}">` +
        `<span style="height:${(i.value / max) * 100}%"></span></div>` +
        `<div class="col-l">${idx % labelEvery === 0 ? esc(i.label) : ''}</div></div>`).join('');
      const peak = items.reduce((a, b) => (b.value > a.value ? b : a), items[0]);
      return `<div class="cols">${cols}</div>` +
        (peak && peak.value ? `<p class="peak">Busiest: <b>${esc(peak.title)}</b> · ${nf.format(peak.value)}</p>` : '');
    }

    // Gap-free rolling 30-day series (missing days zero-filled) with readable labels.
    function last30(byDay) {
      const map = new Map((byDay || []).map((d) => [d.day, (d.visits || 0) + (d.plays || 0)]));
      const out = [];
      for (let i = 29; i >= 0; i--) {
        const dt = new Date(Date.now() - i * 86400000);
        const key = dt.toISOString().slice(0, 10);
        out.push({
          label: String(dt.getDate()),
          title: dt.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }),
          value: map.get(key) || 0,
        });
      }
      return out;
    }

    function render(s) {
      const byHour = Array.from({ length: 24 }, (_, h) => (s.by_hour || []).find((x) => x.hour === h) || { hour: h, visits: 0, plays: 0 });
      const hours = byHour.map((x) => ({
        label: String(x.hour),
        title: `${String(x.hour).padStart(2, '0')}:00`,
        value: (x.visits || 0) + (x.plays || 0),
      }));
      const perGame = (s.per_game || [])
        .map((g) => ({ slug: g.game, value: g.plays || 0 }))
        .sort((a, b) => b.value - a.value);
      root.innerHTML =
        `${rangesBar()}<div class="cards">
          <div class="card"><div class="n">${nf.format(s.total_visits)}</div><div class="l">Visits</div></div>
          <div class="card"><div class="n">${nf.format(s.unique_visitors)}</div><div class="l">Unique visitors</div></div>
          <div class="card"><div class="n">${nf.format(s.total_plays)}</div><div class="l">Plays</div></div>
        </div>
        <p class="today">Today so far · <span><b>${nf.format(s.visits_today)}</b> visits</span><span><b>${nf.format(s.plays_today)}</b> plays</span></p>
        <section><h2>Plays per game <span class="rl">· ${rangeLabel()}</span></h2>${bars(perGame, 'plays')}</section>
        <section><h2>By hour of day <span class="rl">· ${rangeLabel()}</span></h2>${columns(hours, 3)}</section>
        <section><h2>Last 30 days <span class="rl">· not filtered</span></h2>${columns(last30(s.by_day), 5)}</section>`;
      actions.innerHTML = `<span class="upd">Updated ${new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })}</span><button class="btn ghost" id="out">Sign out</button>`;
      document.getElementById('out').onclick = () => supabase.auth.signOut();
      root.querySelectorAll('.chip').forEach((b) => (b.onclick = () => {
        currentDays = b.dataset.days === '' ? null : Number(b.dataset.days);
        load();
      }));
    }

    let loading = false;
    async function load() {
      if (loading) return; // avoid overlapping RPCs (auth events + auto-refresh)
      loading = true;
      const reqDays = currentDays;
      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) { signInView('This page is private — sign in as the owner.'); return; }
        const { data, error } = await supabase.rpc('arcade_stats', { p_days: reqDays });
        if (error) {
          const denied = /not authorized/i.test(error.message || '');
          signInView(denied ? 'Signed in, but this account is not the owner.' : 'Could not load stats — please try again.');
          return;
        }
        render(data);
      } finally {
        loading = false;
        if (reqDays !== currentDays) load(); // filter changed mid-request — refetch
      }
    }

    // INITIAL_SESSION is handled by the single load() below; only react to real changes.
    supabase.auth.onAuthStateChange((event) => {
      if (event === 'SIGNED_IN' || event === 'SIGNED_OUT') load();
    });
    setInterval(() => { if (!document.hidden) load(); }, 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
    load();
  </script>
</body>
</html>
