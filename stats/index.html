<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://esm.sh; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://esm.sh; font-src 'self'; base-uri 'self'; object-src 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="dark" />
  <title>Tiny Arcade — Stats</title>
  <style>
    :root {
      --bg: #0c0d12; --bg-soft: #14161d; --line: #262a36; --text: #f2f4f9;
      --muted: #949cb0; --accent: #fb7185; color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1000px 500px at 50% -10%, #15181f, transparent 70%), var(--bg);
      color: var(--text); min-height: 100dvh; padding: 24px 16px 60px;
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; margin: 0; letter-spacing: -.02em; }
    a.back { color: var(--muted); text-decoration: none; font-size: .85rem; }
    a.back:hover { color: var(--text); }
    .btn {
      font: inherit; font-weight: 700; color: #10131c; background: var(--accent);
      border: none; border-radius: 999px; padding: 10px 20px; cursor: pointer;
    }
    .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 6px 14px; font-weight: 600; }
    .btn.ghost:hover { color: var(--text); border-color: var(--muted); }
    .hdr-actions { display: flex; align-items: center; gap: 12px; }
    .upd { color: var(--muted); font-size: .72rem; font-variant-numeric: tabular-nums; }
    .ranges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .chip { font: inherit; font-size: .8rem; font-weight: 600; color: var(--muted); background: var(--bg-soft); border: 1px solid var(--line); border-radius: 999px; padding: 6px 15px; cursor: pointer; }
    .chip:hover:not(.on) { color: var(--text); border-color: var(--muted); }
    .chip.on { color: #10131c; background: var(--accent); border-color: var(--accent); font-weight: 800; }
    .rl { color: var(--muted); font-weight: 500; font-size: .82rem; }
    .msg { color: var(--muted); background: var(--bg-soft); border: 1px solid var(--line); border-radius: 14px; padding: 24px; text-align: center; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 26px; }
    .card { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
    .card .n { font-size: 1.9rem; font-weight: 900; letter-spacing: -.02em; }
    .card .l { color: var(--muted); font-size: .78rem; margin-top: 2px; }
    section { margin-bottom: 30px; }
    section h2 { font-size: 1rem; margin: 0 0 12px; }
    .row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: .85rem; }
    .row .k { width: 120px; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
    .bar { flex: 1; background: var(--bg-soft); border-radius: 6px; overflow: hidden; height: 22px; position: relative; border: 1px solid var(--line); }
    .bar > span { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 6px; min-width: 2px; }
    .row .v { width: 56px; flex: none; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
    .hours { display: grid; grid-template-columns: repeat(24, 1fr); grid-template-rows: 130px; gap: 3px; }
    .hours .h { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 4px 4px 0 0; position: relative; }
    .hours .h > span { position: absolute; inset: auto 0 0 0; background: var(--accent); border-radius: 4px 4px 0 0; }
    .hlabels { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; margin-top: 4px; color: var(--muted); font-size: .58rem; text-align: center; }
    .foot { color: var(--muted); font-size: .75rem; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="vertical-align:-4px" aria-hidden="true"><path d="M5 19V10M12 19V5M19 19v-7"/></svg> Tiny Arcade — Stats</h1>
      <div class="hdr-actions"><span id="actions"></span><a class="back" href="/index.html">← Arcade</a></div>
    </header>
    <div id="root"><div class="msg">Loading…</div></div>
    <p class="foot">Private · anonymous analytics · times in IST (Asia/Kolkata).</p>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    const SUPABASE_URL = 'https://tmngedsmgcgbkbkmsnsw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_qFZySs9l19_7bISrvmLHIw_vwt-DUdx';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    const root = document.getElementById('root');
    const actions = document.getElementById('actions');
    const esc = (s) => String(s ?? '').replace(/[&<>"'`]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' }[c]));

    // slug -> [icon, display name] for friendlier "Plays per game" labels.
    function ic(inner) { return `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px" aria-hidden="true">${inner}</svg>`; }
    const GAME_META = {
      'hue-hunt': [ic('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.4"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/>'), 'Hue Hunt'],
      where: [ic('<path d="M12 21S5.5 15 5.5 10A6.5 6.5 0 0 1 12 3.5 6.5 6.5 0 0 1 18.5 10c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>'), 'Where'],
      echo: [ic('<path d="M8.5 8.8a4.6 4.6 0 0 0 0 6.4M15.5 8.8a4.6 4.6 0 0 1 0 6.4M5.3 5.6a9 9 0 0 0 0 12.8M18.7 5.6a9 9 0 0 1 0 12.8"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>'), 'Echo'],
      flash: ['<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" stroke="none" style="vertical-align:-2px" aria-hidden="true"><path d="M13 2 4.5 13.5h5.7L9 22l9.5-12.5h-5.7z"/></svg>', 'Flash'],
      chromatic: [ic('<path d="M12 3.2c3.4 4 6.3 7.5 6.3 10.8a6.3 6.3 0 0 1-12.6 0c0-3.3 2.9-6.8 6.3-10.8z"/>'), 'Chromatic'],
      flashmath: [ic('<rect x="4" y="3" width="16" height="18" rx="2.4"/><path d="M7.3 8h9.4M7.3 12h9.4M7.3 16h5.6"/>'), 'Flashmath'],
      wordle: [ic('<rect x="3" y="9" width="5.4" height="5.4" rx="1"/><rect x="9.3" y="9" width="5.4" height="5.4" rx="1" fill="currentColor" stroke="none"/><rect x="15.6" y="9" width="5.4" height="5.4" rx="1"/>'), 'Wordle'],
      'digit-span': [ic('<path d="M9 3.5 6.4 20.5M17.6 3.5 15 20.5M4 9h16M3 15h16"/>'), 'Digit Span'],
      word: [ic('<path d="M12 5.6c-2-1.6-5-2.1-8-1.6v14c3-.5 6 0 8 1.6 2-1.6 5-2.1 8-1.6V4c-3-.5-6 0-8 1.6z"/><path d="M12 5.6v14"/>'), 'Word of the Day'],
      sprint: [ic('<rect x="3" y="6" width="18" height="12" rx="2.2"/><path d="M6.6 10h.01M10 10h.01M13.4 10h.01M16.8 10h.01M6.6 14h10.6"/>'), 'Sprint'],
      interval: [ic('<path d="M9 18V5.3L19 3v13"/><circle cx="6.8" cy="18" r="2.4" fill="currentColor" stroke="none"/><circle cx="16.8" cy="16" r="2.4" fill="currentColor" stroke="none"/>'), 'Interval'],
      hub: [ic('<path d="M6 10a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v3a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4v-3z"/><path d="M9 11v3M7.5 12.5h3M16 12h.01M18 14h.01"/>'), 'Hub'],
    };
    const gameLabel = (slug) => { const m = GAME_META[slug]; return m ? { icon: m[0], text: m[1] } : { text: slug || '—' }; };

    // Time-range filter for the windowed figures (null = all time).
    const RANGES = [['24h', 1], ['7 days', 7], ['30 days', 30], ['All', null]];
    let currentDays = null;
    const rangeLabel = () => currentDays == null ? 'all time' : currentDays === 1 ? 'last 24h' : `last ${currentDays} days`;
    const rangesBar = () => '<div class="ranges">' + RANGES.map(([lbl, d]) =>
      `<button class="chip${d === currentDays ? ' on' : ''}" data-days="${d == null ? '' : d}">${lbl}</button>`).join('') + '</div>';

    function signInView(note) {
      actions.innerHTML = '';
      root.innerHTML = `<div class="msg">${note ? esc(note) + '<br><br>' : ''}<button class="btn" id="si">Sign in with Google</button></div>`;
      document.getElementById('si').onclick = () =>
        supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
    }

    function bars(items, fmt, label) {
      const max = Math.max(1, ...items.map((i) => i.value));
      return items.map((i) => {
        const f = fmt(i);
        const icon = typeof f === 'object' ? f.icon || '' : '';
        const text = typeof f === 'object' ? f.text : f;
        return `<div class="row"><span class="k">${icon}${esc(text)}</span>` +
          `<div class="bar" role="img" aria-label="${esc(text)}: ${i.value}"><span style="width:${(i.value / max) * 100}%"></span></div>` +
          `<span class="v">${i.value}</span></div>`;
      }).join('') || `<div class="msg">No ${label} yet.</div>`;
    }

    // Gap-free rolling 30-day series (missing days zero-filled) with readable labels.
    function last30(byDay) {
      const map = new Map((byDay || []).map((d) => [d.day, (d.visits || 0) + (d.plays || 0)]));
      const out = [];
      for (let i = 29; i >= 0; i--) {
        const dt = new Date(Date.now() - i * 86400000);
        const key = dt.toISOString().slice(0, 10);
        out.push({ label: dt.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }), value: map.get(key) || 0 });
      }
      return out;
    }

    function render(s) {
      const byHour = Array.from({ length: 24 }, (_, h) => (s.by_hour || []).find((x) => x.hour === h) || { hour: h, visits: 0, plays: 0 });
      const hmax = Math.max(1, ...byHour.map((x) => (x.visits || 0) + (x.plays || 0)));
      const perGame = (s.per_game || []).map((g) => ({ slug: g.game, value: g.plays || 0 }));
      root.innerHTML =
        `${rangesBar()}<div class="cards">
          <div class="card"><div class="n">${s.total_visits}</div><div class="l">Visits</div></div>
          <div class="card"><div class="n">${s.unique_visitors}</div><div class="l">Unique visitors</div></div>
          <div class="card"><div class="n">${s.total_plays}</div><div class="l">Plays</div></div>
          <div class="card"><div class="n">${s.visits_today}</div><div class="l">Visits today</div></div>
          <div class="card"><div class="n">${s.plays_today}</div><div class="l">Plays today</div></div>
        </div>
        <section><h2>Plays per game <span class="rl">· ${rangeLabel()}</span></h2>${bars(perGame, (i) => gameLabel(i.slug), 'plays')}</section>
        <section><h2>By hour of day <span class="rl">· ${rangeLabel()}</span></h2>
          <div class="hours">${byHour.map((x) => `<div class="h" title="${x.hour}:00 — ${x.visits}v ${x.plays}p"><span style="height:${(((x.visits || 0) + (x.plays || 0)) / hmax) * 100}%"></span></div>`).join('')}</div>
          <div class="hlabels">${byHour.map((x) => `<div>${x.hour % 3 === 0 ? x.hour : ''}</div>`).join('')}</div>
        </section>
        <section><h2>Last 30 days</h2>${bars(last30(s.by_day), (i) => i.label, 'activity')}</section>`;
      actions.innerHTML = `<span class="upd">Updated ${new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })}</span><button class="btn ghost" id="out">Sign out</button>`;
      document.getElementById('out').onclick = () => supabase.auth.signOut();
      root.querySelectorAll('.chip').forEach((b) => (b.onclick = () => {
        currentDays = b.dataset.days === '' ? null : Number(b.dataset.days);
        load();
      }));
    }

    let loading = false;
    async function load() {
      if (loading) return; // avoid overlapping RPCs (auth events + auto-refresh)
      loading = true;
      const reqDays = currentDays;
      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) { signInView('This page is private — sign in as the owner.'); return; }
        const { data, error } = await supabase.rpc('arcade_stats', { p_days: reqDays });
        if (error) {
          const denied = /not authorized/i.test(error.message || '');
          signInView(denied ? 'Signed in, but this account is not the owner.' : 'Could not load stats — please try again.');
          return;
        }
        render(data);
      } finally {
        loading = false;
        if (reqDays !== currentDays) load(); // filter changed mid-request — refetch
      }
    }

    // INITIAL_SESSION is handled by the single load() below; only react to real changes.
    supabase.auth.onAuthStateChange((event) => {
      if (event === 'SIGNED_IN' || event === 'SIGNED_OUT') load();
    });
    setInterval(() => { if (!document.hidden) load(); }, 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
    load();
  </script>
</body>
</html>
