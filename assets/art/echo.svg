<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Echo art">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2130"/><stop offset="100%" stop-color="#12141c"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>
  <g fill="none" stroke="#2dd4bf">
    <circle cx="200" cy="120" r="90" stroke-opacity="0.14" stroke-width="2"/>
    <circle cx="200" cy="120" r="66" stroke-opacity="0.28" stroke-width="2"/>
    <circle cx="200" cy="120" r="42" stroke-opacity="0.5"  stroke-width="2.5"/>
  </g>
  <circle cx="200" cy="120" r="16" fill="#2dd4bf" filter="url(#glow)"/>
</svg>
