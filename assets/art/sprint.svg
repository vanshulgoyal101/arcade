<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sprint art">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2130"/><stop offset="100%" stop-color="#12141c"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>
  <!-- speed streaks -->
  <g stroke="#38bdf8" stroke-linecap="round" stroke-opacity="0.16">
    <line x1="300" y1="150" x2="352" y2="150" stroke-width="3"/>
    <line x1="296" y1="134" x2="336" y2="134" stroke-width="2.5"/>
    <line x1="296" y1="166" x2="336" y2="166" stroke-width="2.5"/>
  </g>
  <!-- keycaps -->
  <g>
    <rect x="70"  y="132" width="48" height="48" rx="10" fill="#232c3e"/>
    <rect x="126" y="132" width="48" height="48" rx="10" fill="#232c3e"/>
    <rect x="182" y="132" width="48" height="48" rx="10" fill="#38bdf8" filter="url(#glow)"/>
    <rect x="238" y="132" width="48" height="48" rx="10" fill="#232c3e"/>
  </g>
  <!-- long spacebar -->
  <rect x="96" y="192" width="196" height="26" rx="9" fill="#1e2636"/>
</svg>
