<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Interval art">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2130"/>
      <stop offset="100%" stop-color="#12141c"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c56cf0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c56cf0"/>
      <stop offset="100%" stop-color="#c56cf0" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>
  <!-- concentric interval arcs -->
  <g fill="none" stroke="url(#wave)" filter="url(#glow)">
    <path d="M60 130 Q200 40 340 130" stroke-width="3" opacity="0.9"/>
    <path d="M60 130 Q200 70 340 130" stroke-width="2.5" opacity="0.6"/>
    <path d="M60 130 Q200 100 340 130" stroke-width="2" opacity="0.4"/>
  </g>
  <!-- two notes -->
  <circle cx="60" cy="130" r="9" fill="#c56cf0" filter="url(#glow)"/>
  <circle cx="340" cy="130" r="9" fill="#c56cf0" filter="url(#glow)"/>
  <!-- piano keys -->
  <g>
    <rect x="120" y="176" width="160" height="46" rx="8" fill="#20283a"/>
    <g stroke="#2f3a52" stroke-width="2">
      <line x1="152" y1="178" x2="152" y2="220"/>
      <line x1="184" y1="178" x2="184" y2="220"/>
      <line x1="216" y1="178" x2="216" y2="220"/>
      <line x1="248" y1="178" x2="248" y2="220"/>
    </g>
    <rect x="184" y="176" width="32" height="30" rx="5" fill="#c56cf0"/>
  </g>
</svg>
