<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hue Hunt art">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2130"/>
      <stop offset="100%" stop-color="#12141c"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>
  <g>
    <!-- muted 3x3 tile grid, centred -->
    <g fill="#2b3446">
      <rect x="102" y="32"  width="56" height="56" rx="12"/>
      <rect x="172" y="32"  width="56" height="56" rx="12"/>
      <rect x="242" y="32"  width="56" height="56" rx="12"/>
      <rect x="102" y="102" width="56" height="56" rx="12"/>
      <rect x="242" y="102" width="56" height="56" rx="12"/>
      <rect x="102" y="172" width="56" height="56" rx="12"/>
      <rect x="172" y="172" width="56" height="56" rx="12"/>
      <rect x="242" y="172" width="56" height="56" rx="12"/>
    </g>
    <!-- the odd tile, glowing, dead centre -->
    <rect x="172" y="102" width="56" height="56" rx="12" fill="#fb7185" filter="url(#glow)"/>
  </g>
</svg>
