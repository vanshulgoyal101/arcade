<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flashmath art">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2130"/><stop offset="100%" stop-color="#12141c"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>
  <!-- plus (glowing accent) -->
  <g transform="translate(150,84)" filter="url(#glow)" fill="#fb923c">
    <rect x="-4" y="-16" width="8" height="32" rx="4"/><rect x="-16" y="-4" width="32" height="8" rx="4"/>
  </g>
  <!-- minus -->
  <g transform="translate(250,84)" fill="#2b3446"><rect x="-16" y="-4" width="32" height="8" rx="4"/></g>
  <!-- multiply -->
  <g transform="translate(150,176) rotate(45)" fill="#2b3446">
    <rect x="-4" y="-16" width="8" height="32" rx="4"/><rect x="-16" y="-4" width="32" height="8" rx="4"/>
  </g>
  <!-- divide -->
  <g transform="translate(250,176)" fill="#2b3446">
    <circle cx="0" cy="-12" r="4.5"/><rect x="-16" y="-4" width="32" height="8" rx="4"/><circle cx="0" cy="12" r="4.5"/>
  </g>
</svg>
