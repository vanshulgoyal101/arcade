<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Digit Span art">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2130"/><stop offset="100%" stop-color="#12141c"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>
  <!-- connecting path, centred -->
  <polyline points="98,130 166,130 234,130 302,130" fill="none" stroke="#2b3446" stroke-width="2"/>
  <!-- memory nodes: some recalled (glowing), some pending -->
  <g>
    <circle cx="98"  cy="130" r="15" fill="#34d399" filter="url(#glow)"/>
    <circle cx="166" cy="130" r="15" fill="#34d399" filter="url(#glow)"/>
    <circle cx="234" cy="130" r="15" fill="#34d399" filter="url(#glow)"/>
    <circle cx="302" cy="130" r="15" fill="none" stroke="#33465e" stroke-width="2.5"/>
  </g>
  <!-- next-in-sequence pulse -->
  <circle cx="302" cy="130" r="24" fill="none" stroke="#34d399" stroke-opacity="0.3" stroke-width="2"/>
</svg>
